        ];

        let currentMode = 'blacklist';
        let currentCars = [...blacklistCars];
        let currentOpenedCar = null;

        const btnBlacklist = document.getElementById('btnBlacklist');
        const btnShowroom = document.getElementById('btnShowroom');
        const carsContainer = document.getElementById('carsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalSpecs = document.getElementById('modalSpecs');
        const modalPrice = document.getElementById('modalPrice');
        const detailsToggleBtn = document.getElementById('detailsToggleBtn');
        const detailsList = document.getElementById('detailsList');
        const modalCarImage = document.getElementById('modalCarImage');

        // Глобальное меню
        const globalMenuBtn = document.getElementById('globalMenuBtn');
        const globalDropdown = document.getElementById('globalDropdown');
        const closeMenuBtn = document.getElementById('closeMenuBtn');

        globalMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            globalDropdown.classList.toggle('show');
        });

        closeMenuBtn.addEventListener('click', () => {
            globalDropdown.classList.remove('show');
        });

        document.addEventListener('click', (e) => {
            if (!globalDropdown.contains(e.target) && e.target !== globalMenuBtn) {
                globalDropdown.classList.remove('show');
            }
        });

        function renderCars() {
            carsContainer.innerHTML = '';
            currentCars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `<div class="car-img"><img src="${car.img}" alt="${car.name}" loading="lazy" onerror="this.src='https://i.imgur.com/0iCZoCe.png'"></div><div class="car-name">${car.name}</div>`;
                card.addEventListener('click', () => openModal(car));
                carsContainer.appendChild(card);
            });
        }

        function openModal(car) {
            currentOpenedCar = car;
            modalTitle.textContent = car.name;
            modalCarImage.innerHTML = `<img src="${car.img}" alt="${car.name}" onerror="this.src='https://i.imgur.com/0iCZoCe.png'">`;
            let specsHTML = `<div class="spec-row"><span>⏲ Макс. скорость</span> <strong>${car.speed} км/ч</strong></div>
                             <div class="spec-row"><span>⚠︎ Управление</span> <strong>${car.handling}/10</strong></div>
                             <div class="spec-row"><span>⏱ Разгон (0-100)</span> <strong>${car.acceleration}/10</strong></div>
                             <div class="spec-row"><span>𓎚 Двигатель</span> <strong>${car.engine || '—'}</strong></div>
                             <div class="spec-row"><span>⚙︎ Привод</span> <strong>${car.drive || '—'}</strong></div>`;
            if (currentMode === 'blacklist') {
                specsHTML += `<div class="spec-row"><span>💨 NOS</span> <strong>${car.nos}</strong></div>`;
            }
            modalSpecs.innerHTML = specsHTML;
            if(currentMode === 'showroom' && car.price) {
                modalPrice.innerHTML = `<div class="price-big">💰 Цена: ${car.price}</div>`;
            } else if (currentMode === 'blacklist' && car.price) {
                modalPrice.innerHTML = `<div class="price-big">🏆 Стоимость: ${car.price}</div>`;
            } else {
                modalPrice.innerHTML = (currentMode === 'blacklist') ? `<div class="price-big">🏆 Трофейная машина</div>` : '';
            }
            detailsList.classList.remove('show');
            detailsList.innerHTML = '';
            modalOverlay.classList.add('active');
        }

        function closeModal() { modalOverlay.classList.remove('active'); currentOpenedCar = null; }

        function toggleDetails() {
            if (!currentOpenedCar) return;
            if (detailsList.classList.contains('show')) { detailsList.classList.remove('show'); return; }
            const car = currentOpenedCar;
            if (car.details && car.details.length) {
                let html = '';
                car.details.forEach((line) => { html += `<div>⚡ ${line}</div>`; });
                detailsList.innerHTML = html;
            } else { detailsList.innerHTML = '<div>📄 Нет данных по обвесу</div>'; }
            detailsList.classList.add('show');
        }

        btnBlacklist.addEventListener('click', () => { currentMode='blacklist'; currentCars=[...blacklistCars]; btnBlacklist.classList.add('active'); btnShowroom.classList.remove('active'); renderCars(); closeModal(); });
        btnShowroom.addEventListener('click', () => { currentMode='showroom'; currentCars=[...showroomCars]; btnShowroom.classList.add('active'); btnBlacklist.classList.remove('active'); renderCars(); closeModal(); });
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if(e.target===modalOverlay) closeModal(); });
        detailsToggleBtn.addEventListener('click', toggleDetails);

        renderCars();
    })();
</script>
